# Dataset builder 用設定（TTS: Sidon enhance 込み）。
# コーパスパス・話者リストは環境に合わせて変更してください。
# 雛形の差分比較は config/example.yaml を参照。

schema_version: 2

input:
  corpus_root: CommonVoice
  clip_tsv: validated.tsv
  audio_subdir: clips
  locale_expected: ja
  max_clips: null

speakers:
  merge_filtered_speakers_as_one: false
  max_clips_per_speaker: null
  include_client_ids: []
  clip_metadata_filters:
    genders: []
    ages: []
    accents: []
    variants: []
    locales: []
    segments: []
    up_votes: null
    down_votes: null

# Align →（将来 MFA/NFA）→ Sidon enhance。依存: uv sync --extra sidon
audio_pipeline_align:
  target_sample_rate: 24000
  channels: 1
  audio_pipeline_id: align_gate_v1
  steps:
    - type: resample
      sr: 24000
    - type: trim_silence
      max_keep_sec: 30.0
      head_tail_db: 40
      trim_frame_length: 1024
      trim_hop_length: 256
      pad_head_ms: 40
      pad_tail_ms: 20
      reject_if_truncated: true

audio_pipeline_enhance:
  target_sample_rate: 24000
  channels: 1
  audio_pipeline_id: default_v1
  steps:
    - type: sidon_restore
      device: auto
    - type: normalize
      method: loudness
      integrated_lufs: -23.0
    - type: save_wav
      bit_depth: 16

quality_gate:
  min_duration_sec: 0.3
  max_duration_sec: 30.0
  min_sec_per_mora: 0.068
  mora_gate_relax: 0.92
  max_silence_ratio: 0.45
  silence_ratio_ref_percentile: 92
  silence_ratio_rms_floor: 0.05
  # Sidon 後は推定 SNR が下がりやすい／取れないことがあるためハード SNR は無効化
  min_estimated_snr_db: null
  max_clipping_ratio: 0.012
  max_abs_dc_offset: 0.05
  max_trailing_silence_sec: null
  quality_tier_mode: reject_b
  quality_tier_a_min_snr_db: 16.0
  quality_tier_b_min_snr_db: 6.0
  quality_tier_a_max_silence_ratio: 0.32
  quality_tier_b_max_silence_ratio: 0.42
  quality_tier_a_max_clipping_ratio: 0.006
  quality_tier_unknown_snr_silence_a: 0.34
  quality_tier_unknown_snr_silence_b: 0.45
  sidon_after_enhance_split:
    enabled: true
    device: auto

snr:
  frame_ms: 25.0
  hop_ms: 10.0
  noise_percentile: 15.0
  signal_percentile: 60.0
  min_frames: 4

text:
  max_text_len: 500
  min_text_len: 1
  require_japanese: true
  phonemize: true
  g2p_kana: false
  phoneme_word_separator: "|"

early_audio_gate:
  enabled: true
  check_silence_ratio: false
  check_snr: false

two_pass_denoise:
  enabled: true
  sgmse_micro_batch_max: 2
  enhance_phase: interleaved

# analyze 現状は NFA/MFA をスキップ。legacy preprocess と揃えるときだけ true。
nfa_gate:
  enabled: false

asr_gate:
  enabled: false

output:
  root: out/cv_tts_builder
  format: wav
  manifest: metadata.jsonl
  validated_tsv: validated.tsv
  wav_subdir: wavs

dataset_builder:
  enabled: true
  work_dir: work
  target_duration_hours: 100
  random_seed: 42
  selection:
    local_search: { enabled: true, max_iterations: 500, max_seconds: 30, swap_patterns: [1v1] }
  speaker_constraints:
    max_duration_minutes: 120
  split:
    protocol: unseen_speaker
    train: 0.85
    val: 0.10
    test: 0.05
  materialize:
    mode: copy
    atomic_rename: true

compute:
  backend: auto
